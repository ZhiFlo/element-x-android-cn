name: CN Upstream Sync and APK

on:
  push:
    branches:
      - develop
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: cn-upstream-sync-apk
  cancel-in-progress: false

jobs:
  sync-build:
    if: github.repository == 'ZhiFlo/element-x-android-cn'
    runs-on: [self-hosted, linux, x64, android-build]
    timeout-minutes: 120
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
      CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-configuration-cache -Dsonar.gradle.skipCompile=true
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "zhiflo-upstream-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Merge upstream Element X
        id: merge
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -u
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/element-hq/element-x-android.git
          git fetch --prune upstream develop

          before="$(git rev-parse HEAD)"
          if git merge --no-edit upstream/develop; then
            after="$(git rev-parse HEAD)"
            if [ "$before" != "$after" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            conflicts="$(git diff --name-only --diff-filter=U | paste -sd ',' -)"
            git merge --abort || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "conflicts=$conflicts" >> "$GITHUB_OUTPUT"
          fi

      - name: Report upstream merge conflict
        if: steps.merge.outputs.conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[upstream-sync] Element X merge conflict";
            const conflicts = process.env.CONFLICTS || "(unable to enumerate)";
            const body = [
              "Automatic merge from `element-hq/element-x-android:develop` failed.",
              "",
              "Conflicting paths:",
              "```",
              conflicts.split(",").join("\n"),
              "```",
              "",
              "The fork branch was left unchanged. Resolve the conflict manually, push the result to `develop`, and the next run will continue normally."
            ].join("\n");
            const { owner, repo } = context.repo;
            const issues = await github.rest.issues.listForRepo({ owner, repo, state: "open", per_page: 100 });
            const existing = issues.data.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
        env:
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}

      - name: Stop on merge conflict
        if: steps.merge.outputs.conflict == 'true'
        run: exit 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Android build runner
        shell: bash
        run: |
          test -n "${ANDROID_HOME:-}" || { echo "ANDROID_HOME is not set on the android-build runner"; exit 1; }
          test -x ./gradlew || chmod +x ./gradlew
          java -version
          ./gradlew --version

      - name: Build installable GPlay debug APK
        run: |
          ./gradlew assembleGplayDebug -PallWarningsAsErrors=true $CI_GRADLE_ARG_PROPERTIES

      - name: Capture build metadata
        id: meta
        shell: bash
        run: |
          echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          find app/build/outputs/apk/gplay/debug -type f -name '*.apk' -print -exec sha256sum {} \;

      - name: Push verified upstream merge
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:develop

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: element-x-cn-${{ steps.meta.outputs.sha }}
          path: app/build/outputs/apk/gplay/debug/*.apk
          if-no-files-found: error
          retention-days: 14
