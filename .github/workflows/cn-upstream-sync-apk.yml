name: CN Upstream Sync and APK

on:
  push:
    branches:
      - develop
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cn-upstream-sync-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-build:
    if: github.repository == 'ZhiFlo/element-x-android-cn'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
      CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-configuration-cache -Dsonar.gradle.skipCompile=true
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "zhiflo-upstream-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Merge upstream Element X
        id: merge
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -u
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/element-hq/element-x-android.git
          git fetch --prune upstream develop
          before="$(git rev-parse HEAD)"
          if git merge --no-edit upstream/develop; then
            after="$(git rev-parse HEAD)"
            if [ "$before" != "$after" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            conflicts="$(git diff --name-only --diff-filter=U | paste -sd ',' -)"
            git merge --abort || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "conflicts=$conflicts" >> "$GITHUB_OUTPUT"
          fi

      - name: Report upstream merge conflict
        if: steps.merge.outputs.conflict == 'true'
        shell: bash
        run: |
          echo "::error title=Element X upstream merge conflict::${{ steps.merge.outputs.conflicts }}"
          {
            echo "## Element X upstream merge conflict"
            echo
            echo "Automatic merge from element-hq/element-x-android:develop failed."
            echo
            echo "Conflicting paths:"
            echo "${{ steps.merge.outputs.conflicts }}" | tr ',' '\n'
            echo
            echo "The fork branch was left unchanged."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop on merge conflict
        if: steps.merge.outputs.conflict == 'true'
        run: exit 1

      - name: Set up JDK 21
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.merge.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Android build environment
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.merge.outputs.changed == 'true'
        shell: bash
        run: |
          test -n "${ANDROID_HOME:-}" || { echo "ANDROID_HOME is not set on the android-build runner"; exit 1; }
          test -x ./gradlew || chmod +x ./gradlew
          java -version
          ./gradlew --version

      - name: Build installable GPlay debug APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.merge.outputs.changed == 'true'
        run: |
          ./gradlew assembleGplayDebug -PallWarningsAsErrors=true $CI_GRADLE_ARG_PROPERTIES

      - name: Capture build metadata
        id: meta
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.merge.outputs.changed == 'true'
        shell: bash
        run: |
          echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          find app/build/outputs/apk/gplay/debug -type f -name '*.apk' -print -exec sha256sum {} \;

      - name: Push verified upstream merge
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        env:
          SYNC_SSH_KEY: ${{ secrets.SYNC_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SYNC_SSH_KEY" || { echo "SYNC_SSH_KEY secret is missing"; exit 1; }
          key_dir="$RUNNER_TEMP/zhiflo-sync-ssh"
          install -d -m 700 "$key_dir"
          printf '%s\n' "$SYNC_SSH_KEY" > "$key_dir/id_ed25519"
          chmod 600 "$key_dir/id_ed25519"
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com > "$key_dir/known_hosts"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          GIT_SSH_COMMAND="ssh -i $key_dir/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=$key_dir/known_hosts" git push origin HEAD:develop

      - name: Upload APKs
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.merge.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: element-x-cn-${{ steps.meta.outputs.sha }}
          path: app/build/outputs/apk/gplay/debug/*.apk
          if-no-files-found: error
          retention-days: 14
