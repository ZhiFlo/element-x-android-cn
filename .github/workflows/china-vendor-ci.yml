name: China Vendor Push CI

on:
  push:
    branches:
      - feature/china-push-vendor-adapters
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: china-vendor-push-ci
  cancel-in-progress: true

jobs:
  xiaomi:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Xiaomi adapter against compatibility fixture
        run: |
          ./gradlew +            :libraries:pushproviders:chinapush-xiaomi:compileDebugKotlin +            -Pchinapush.xiaomi.mavenCoordinate=io.github.hebeiliang.mipush:Push:2.0.0 +            --stacktrace +            --no-configuration-cache
